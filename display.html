
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoop Everything — Shared Display</title>

<script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5-phone@1.15.2/dist/p5-phone.min.js"></script>

<style>
:root {
  --ink: #343B4D;
  --muted: #777E90;
  --line: rgba(52,59,77,.17);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: #E9EAF0;
}

.screen {
  position: relative;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 72% 46%,
      rgba(225,195,204,.45),
      transparent 48%
    ),
    radial-gradient(
      ellipse at 20% 85%,
      rgba(183,196,222,.35),
      transparent 55%
    ),
    linear-gradient(135deg,#F5F6F9,#DFE2EB);
}

.nav {
  position: absolute;
  top: 38px;
  right: 5%;
  z-index: 10;
}

.nav-label {
  font-size: 10px;
  letter-spacing: .22em;
  color: #858B9B;
}

.welcome {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  padding: 7%;
  z-index: 5;
  transition:
    opacity .8s ease,
    transform .8s ease,
    visibility .8s;
}

.intro {
  width: 48%;
  position: relative;
  z-index: 2;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: .32em;
  color: #737A8C;
  margin-bottom: 28px;
}

h1 {
  font-size: clamp(58px,7.5vw,128px);
  font-weight: 200;
  letter-spacing: -.065em;
  line-height: .95;
  margin: 0;
}

.details {
  display: flex;
  gap: 42px;
  margin-top: 42px;
}

.detail {
  padding-left: 16px;
  border-left: 1px solid var(--line);
}

.detail strong {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 7px;
}

.detail span {
  color: var(--muted);
  font-size: 11px;
}

button {
  font: inherit;
  cursor: pointer;
}

.start {
  margin-top: 48px;
  padding: 19px 34px;
  border: none;
  border-radius: 100px;
  color: white;
  background: var(--ink);
  font-size: 13px;
  transition:
    transform .25s ease,
    background .25s ease;
}

.start:hover {
  transform: translateY(-3px);
  background: #596174;
}

.start span {
  margin-left: 28px;
  font-size: 18px;
}

#preview {
  position: absolute;
  width: min(65vw,900px);
  height: min(65vw,900px);
  right: -6%;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  opacity: .95;
}

.footer {
  position: absolute;
  bottom: 30px;
  left: 5%;
  font-size: 10px;
  letter-spacing: .12em;
  color: #959AAA;
  z-index: 10;
}

.exhibition {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 1s ease,
    visibility 1s;
}

#sharedCanvas {
  display: block;
  width: 100%;
  height: 100%;
}

.exhibition-label {
  position: absolute;
  top: 36px;
  left: 5%;
  color: #73798A;
  font-size: 11px;
  letter-spacing: .22em;
  pointer-events: none;
}

.status {
  position: absolute;
  top: 66px;
  left: 5%;
  color: #818696;
  font-size: 12px;
  pointer-events: none;
}

.reset {
  position: absolute;
  right: 30px;
  bottom: 25px;
  padding: 11px 20px;
  border: 1px solid var(--line);
  border-radius: 100px;
  background: rgba(255,255,255,.5);
  color: var(--ink);
  font-size: 11px;
  opacity: .3;
  transition: opacity .3s;
}

.reset:hover,
.reset:focus-visible {
  opacity: 1;
}

body.playing .welcome {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-20px);
}

body.playing .nav,
body.playing .footer,
body.playing #preview {
  opacity: 0;
  pointer-events: none;
}

body.playing .exhibition {
  opacity: 1;
  visibility: visible;
}

@media (max-width:750px) {
  .welcome { padding: 8%; }
  .intro { width: 100%; }
  h1 { font-size: 58px; }
  .details { gap: 20px; }

  #preview {
    width: 100vw;
    height: 100vw;
    right: -30%;
    top: 27%;
    opacity: .35;
  }
}

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    transition-duration: 0s !important;
  }
}
</style>
</head>

<body>

<div class="screen">

  <header class="nav">
    <div class="nav-label">
      INTERACTIVE INSTALLATION / V2C
    </div>
  </header>

  <section class="welcome">
    <div class="intro">
      <div class="eyebrow">
        COLLECTIVE GENERATIVE ART
      </div>

      <h1>Scoop<br>Everything</h1>

      <div class="details">
        <div class="detail">
          <strong>2 - 4 Players</strong>
          <span>Mobile interaction</span>
        </div>

        <div class="detail">
          <strong>Shared Display</strong>
          <span>Real-time generative art</span>
        </div>
      </div>

      <button class="start" id="startButton">
        Play Together <span>↗</span>
      </button>
    </div>
  </section>

  <canvas id="preview"></canvas>

  <section class="exhibition">
    <canvas id="sharedCanvas"></canvas>

    <div class="exhibition-label">
      SCOOP EVERYTHING / LIVE CANVAS
    </div>

    <div class="status" id="connectionStatus">
      Connecting to shared room...
    </div>

    <button class="reset" id="resetButton">
      Reset Session
    </button>
  </section>

  <div class="footer" id="footerStatus">
    SCOOP EVERYTHING / COLLECTIVE EXPERIENCE
  </div>

</div>

<script>
const SHARE_HOST =
  "https://p5-phone-share.npuckett.workers.dev";
const SHARE_ROOM = "scoop-everything-v2c";
const SHARE_APP = "scoop-everything";

const preview = document.getElementById("preview");
const pctx = preview.getContext("2d");

const shared = document.getElementById("sharedCanvas");
const sctx = shared.getContext("2d");

const statusElement =
  document.getElementById("connectionStatus");

const footerStatus =
  document.getElementById("footerStatus");

const colors = [
  "#D9A7A0",
  "#A9C4C4",
  "#C7B4DB",
  "#E3C5A2",
  "#FFFFFF"
];

const MAX_LAYERS = 24;
const FADE_LAYERS = 10;
const OLDEST_OPACITY = .06;

let particles = [];
let sharedArtworks = [];
let playing = false;

// Invisible p5 canvas supports the Share API.
// The visible display remains the original
// HTML canvas.
function setup() {
  const helper = createCanvas(1, 1);
  helper.hide();
  noLoop();

  shareSetup({
    host: SHARE_HOST,
    room: SHARE_ROOM,
    app: SHARE_APP,
    me: {
      name: "Shared Display",
      role: "display"
    }
  });

  enablePermissionsTap(
    ["share"],
    "Join Shared Artwork"
  );
}

// Receive events sent by the phones.
function shareEvent(name, data, from) {
  if (name !== "scoop") return;
  if (!data || data.player !== 1) return;
  if (!data.artwork) return;

  const a = data.artwork;

  if (
    !Number.isFinite(a.x) ||
    !Number.isFinite(a.y) ||
    !Number.isFinite(a.radius) ||
    !Array.isArray(a.colors) ||
    !Array.isArray(a.fragments)
  ) {
    return;
  }

  addSharedArtwork(a);
}

function addSharedArtwork(a) {
  const now = performance.now();

  for (const k of sharedArtworks) {
    k.opacityFrom = getOpacity(k, now);
    k.opacityTo = Math.max(
      OLDEST_OPACITY,
      k.opacityTo -
        (1 - OLDEST_OPACITY) / FADE_LAYERS
    );
    k.transitionStartedAt = now;
  }

  sharedArtworks.push({
    ...a,
    opacityFrom: 0,
    opacityTo: 1,
    transitionStartedAt: now,
    rotationNow: a.rotation,
    createdAt: now
  });

  if (sharedArtworks.length > MAX_LAYERS) {
    sharedArtworks.shift();
  }
}

function smoothFade(t) {
  const x = Math.max(0, Math.min(1, t));
  return x * x * (3 - 2 * x);
}

function getOpacity(k, now) {
  const duration =
    k.opacityFrom === 0 && k.opacityTo === 1
      ? 650
      : 850;

  const progress = smoothFade(
    (now - k.transitionStartedAt) / duration
  );

  return (
    k.opacityFrom +
    (k.opacityTo - k.opacityFrom) * progress
  );
}

function resizeCanvas2D(canvas, ctx) {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createParticles() {
  particles = [];

  for (let i = 0; i < 850; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.sqrt(Math.random());

    particles.push({
      angle,
      radius,
      size: 1 + Math.random() * 5,
      speed: (Math.random() - .5) * .0005,
      color: colors[
        Math.floor(Math.random() * colors.length)
      ],
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawPreview(time) {
  const w = preview.clientWidth;
  const h = preview.clientHeight;

  pctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const scale = Math.min(w, h) * .38;

  const glow = pctx.createRadialGradient(
    cx, cy, 0,
    cx, cy, scale * 1.4
  );

  glow.addColorStop(
    0, "rgba(235,197,188,.48)"
  );
  glow.addColorStop(
    .6, "rgba(196,185,212,.18)"
  );
  glow.addColorStop(
    1, "rgba(196,185,212,0)"
  );

  pctx.fillStyle = glow;
  pctx.beginPath();
  pctx.arc(
    cx, cy, scale * 1.4,
    0, Math.PI * 2
  );
  pctx.fill();

  for (const p of particles) {
    const a = p.angle + time * p.speed;
    const r = p.radius * scale;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r * .85;

    const breathe =
      1 +
      Math.sin(time * .0008 + p.phase) * .15;

    pctx.save();
    pctx.translate(x, y);
    pctx.rotate(a + time * .00008);
    pctx.globalAlpha = .35 + p.radius * .55;
    pctx.fillStyle = p.color;

    pctx.fillRect(
      -p.size / 2,
      -p.size / 2,
      p.size * breathe,
      p.size * 1.6 * breathe
    );

    pctx.restore();
  }
}

function rgba(c, alpha) {
  return (
    "rgba(" +
    c[0] + "," +
    c[1] + "," +
    c[2] + "," +
    Math.max(0, Math.min(1, alpha)) +
    ")"
  );
}

function drawGlassFragment(ctx, type, s, c, opacity) {
  ctx.fillStyle = rgba(c, .49 * opacity);

  ctx.strokeStyle = rgba(
    c.map(v => Math.min(255, v + 25)),
    .57 * opacity
  );

  ctx.lineWidth = .7;
  ctx.beginPath();

  if (type === 0) {
    ctx.moveTo(-s * .5, -s * .1);
    ctx.lineTo(-s * .15, -s * .45);
    ctx.lineTo(s * .48, -s * .18);
    ctx.lineTo(s * .3, s * .38);
    ctx.lineTo(-s * .3, s * .28);
    ctx.closePath();
  } else if (type === 1) {
    ctx.rect(
      -s * .45,
      -s * .25,
      s * .9,
      s * .5
    );
  } else if (type === 2) {
    ctx.moveTo(-s * .45, s * .3);
    ctx.lineTo(0, -s * .48);
    ctx.lineTo(s * .45, s * .3);
    ctx.closePath();
  } else {
    ctx.arc(0, 0, s * .35, 0, Math.PI * 2);
  }

  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = rgba([255,255,255], .22 * opacity);
  ctx.beginPath();
  ctx.arc(
    -s * .12,
    -s * .12,
    s * .07,
    0,
    Math.PI * 2
  );
  ctx.fill();
}

function drawFragmentGroup(
  ctx, k, radius, opacity, time
) {
  for (const f of k.fragments) {
    ctx.save();

    const drift =
      Math.sin(time * .005 + f.phase) *
      radius * .02;

    ctx.translate(
      radius * f.distance + drift,
      radius * f.offset
    );

    ctx.rotate(
      f.rotation +
      Math.sin(time * .002 + f.phase) * .06
    );

    const size = radius * f.size;
    const c = k.colors[f.colorIndex];

    if (c) {
      drawGlassFragment(
        ctx,
        f.type,
        size,
        c,
        opacity
      );
    }

    ctx.restore();
  }
}

function drawOneKaleidoscope(
  ctx, k, w, h, time, opacity
) {
  const shortest = Math.min(w, h);
  const radius = k.radius * shortest;

  const x =
    k.x * w +
    Math.sin(
      time * k.driftSpeedX + k.phase
    ) * k.driftX * w;

  const y =
    k.y * h +
    Math.cos(
      time * k.driftSpeedY + k.phase
    ) * k.driftY * h;

  const breathing =
    1 +
    Math.sin(
      time * k.breathSpeed + k.phase
    ) * .035;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(breathing, breathing);
  ctx.rotate(k.rotationNow);

  ctx.fillStyle = rgba(
    k.colors[0],
    .047 * opacity
  );
  ctx.beginPath();
  ctx.arc(
    0, 0,
    radius * 1.125,
    0, Math.PI * 2
  );
  ctx.fill();

  for (
    let section = 0;
    section < k.sections;
    section++
  ) {
    ctx.save();

    ctx.rotate(
      section * Math.PI * 2 / k.sections
    );

    drawFragmentGroup(
      ctx, k, radius, opacity, time
    );

    ctx.scale(1, -1);

    drawFragmentGroup(
      ctx, k, radius, opacity, time
    );

    ctx.restore();
  }

  ctx.strokeStyle = rgba(
    k.colors[1],
    .275 * opacity
  );
  ctx.lineWidth = .8;
  ctx.beginPath();
  ctx.arc(
    0, 0,
    radius * .125,
    0, Math.PI * 2
  );
  ctx.stroke();

  ctx.fillStyle = rgba(
    [255,255,255],
    .7 * opacity
  );
  ctx.beginPath();
  ctx.arc(
    0, 0,
    radius * .03,
    0, Math.PI * 2
  );
  ctx.fill();

  ctx.restore();
}

function drawShared(time) {
  const w = shared.clientWidth;
  const h = shared.clientHeight;

  sctx.clearRect(0, 0, w, h);

  const count = sharedArtworks.length;

  for (let i = 0; i < count; i++) {
    const k = sharedArtworks[i];
    const opacity = getOpacity(k, time);
    const age = count - 1 - i;

    const ageProgress = Math.min(
      1,
      age / FADE_LAYERS
    );

    const speedMultiplier =
      1 - ageProgress * .8;

    k.rotationNow +=
      k.rotationSpeed * speedMultiplier;

    drawOneKaleidoscope(
      sctx,
      k,
      w,
      h,
      time / 16.667,
      opacity
    );
  }
}

function updateConnectionStatus() {
  const connected =
    typeof shareConnected !== "undefined" &&
    shareConnected;

  statusElement.textContent = connected
    ? "Share connected · " +
      sharedArtworks.length +
      " scoops received"
    : "Waiting for Share connection";

  footerStatus.textContent = connected
    ? "CONNECTED / " + SHARE_ROOM
    : "SCOOP EVERYTHING / COLLECTIVE EXPERIENCE";
}

function animate(time) {
  drawPreview(time);

  if (playing) {
    drawShared(time);
  }

  updateConnectionStatus();
  requestAnimationFrame(animate);
}

function resizeAll() {
  resizeCanvas2D(preview, pctx);
  resizeCanvas2D(shared, sctx);
}

document.getElementById("startButton")
  .addEventListener("click", () => {
    playing = true;
    document.body.classList.add("playing");
    resizeAll();
  });

document.getElementById("resetButton")
  .addEventListener("click", () => {
    sharedArtworks = [];
    playing = false;
    document.body.classList.remove("playing");
    resizeAll();
  });

window.addEventListener("resize", resizeAll);

createParticles();
resizeAll();
requestAnimationFrame(animate);
</script>

</body>
</html>
