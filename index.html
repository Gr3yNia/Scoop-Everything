<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5-phone@1.15.2/dist/p5-phone.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;

      /* iOS Safari: stop a slow touch starting
         text selection, the long-press callout,
         and the tap highlight flash.
         Visual only — no touch events affected. */
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    canvas {
      display: block;

      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
    }
  </style>
</head>

<body>
  <script src="sketch.js"></script>
</body>
</html>
