
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Scoop Everything — Player 1</title>

  <!-- Same libraries as the working index.html -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5-phone@1.15.2/dist/p5-phone.min.js"></script>

  <style>
    :root {
      --ink: #343B4D;
      --muted: #818696;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;

      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background:
        radial-gradient(
          ellipse at 75% 30%,
          rgba(225, 195, 204, 0.36),
          transparent 55%
        ),
        radial-gradient(
          ellipse at 20% 85%,
          rgba(183, 196, 222, 0.35),
          transparent 55%
        ),
        linear-gradient(
          135deg,
          #F5F6F9,
          #DFE2EB
        );

      color: var(--ink);
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    /*
      Preserve the original canvas behaviour.
      No fixed positioning or touch-action override.
    */
    canvas {
      display: block;

      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
    }

    /*
      Player label doesn't intercept touches.
    */
    .player-label {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      left: 24px;
      z-index: 100;

      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--muted);

      pointer-events: none;
    }

    .player-label strong {
      display: block;
      margin-top: 8px;

      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    button {
      font-family: inherit;
    }
  </style>
</head>

<body>

  <div class="player-label">
    SCOOP EVERYTHING
    <strong>Player 01</strong>
  </div>

  <!-- Original working scooping interaction -->
  <script src="player1.js"></script>

</body>
</html>
