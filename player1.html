
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no"
  >

  <title>Scoop Everything — Player 1</title>

  <style>
    :root {
      --background: #E9EAF0;
      --ink: #343B4D;
      --muted: #818696;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: relative;
      background:
        radial-gradient(
          ellipse at 75% 30%,
          rgba(225, 195, 204, 0.36),
          transparent 55%
        ),
        radial-gradient(
          ellipse at 20% 85%,
          rgba(183, 196, 222, 0.35),
          transparent 55%
        ),
        linear-gradient(
          135deg,
          #F5F6F9,
          #DFE2EB
        );

      color: var(--ink);
      font-family: "Helvetica Neue", Arial, sans-serif;

      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    /*
      Existing p5.js canvas.

      We keep the canvas full-screen so the
      original scooping interaction still works.
    */

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    /*
      Player label.

      pointer-events: none prevents the label
      from blocking finger interactions.
    */

    .player-label {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      left: 24px;
      z-index: 100;

      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;

      color: var(--muted);
      pointer-events: none;
    }

    .player-label strong {
      display: block;
      margin-top: 8px;

      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.03em;
      text-transform: none;

      color: var(--ink);
    }

    /*
      Existing buttons generated by sketch.js
      retain their JavaScript functionality.
    */

    button {
      font-family: inherit;
    }
  </style>

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

  <!-- p5-phone -->
  <script src="https://cdn.jsdelivr.net/npm/p5.phone@1.15.2/dist/p5.phone.min.js"></script>

</head>

<body>

  <div class="player-label">
    SCOOP EVERYTHING
    <strong>Player 01</strong>
  </div>

  <!-- Keep the original working scoop code -->
  <script src="sketch.js"></script>

</body>
</html>
