<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Scoop Everything — DISRUPT (movement test)</title>

  <!-- Same libraries as CREATE / DISRUPT -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5-phone@1.15.2/dist/p5-phone.min.js"></script>

  <style>
    :root {
      --ink: #343B4D;
      --muted: #818696;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;

      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background:
        radial-gradient(
          ellipse at 75% 30%,
          rgba(225, 195, 204, 0.36),
          transparent 55%
        ),
        radial-gradient(
          ellipse at 20% 85%,
          rgba(183, 196, 222, 0.35),
          transparent 55%
        ),
        linear-gradient(
          135deg,
          #F5F6F9,
          #DFE2EB
        );

      color: var(--ink);
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    canvas {
      display: block;

      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
    }

    /* Top-left label, same as DISRUPT. Does not intercept touches. */
    .player-label {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      left: 24px;
      z-index: 100;

      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--muted);

      pointer-events: none;
    }

    .player-label strong {
      display: block;
      margin-top: 8px;

      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    button {
      font-family: inherit;
    }

    /* ---- TEST HARNESS PANEL ---- */
    #test-panel {
      position: fixed;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));

      z-index: 9500;

      width: 216px;
      padding: 10px 11px;

      background: rgba(24, 28, 40, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;

      color: #EDEFF4;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      line-height: 1.5;

      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    #test-panel.hidden .test-body {
      display: none;
    }

    #test-panel .test-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      font-size: 9px;
      letter-spacing: 0.16em;
      color: #9AA2B8;
    }

    #test-panel .test-head button {
      padding: 2px 7px;

      background: rgba(255, 255, 255, 0.1);
      border: 0;
      border-radius: 8px;

      color: #EDEFF4;
      font-size: 11px;
      cursor: pointer;
    }

    #test-panel .test-room {
      margin-top: 6px;

      font-size: 9px;
      color: #7FD1A8;
      word-break: break-all;
      line-height: 1.35;
    }

    #test-panel .test-actions {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }

    #test-panel .test-actions button {
      flex: 1;

      padding: 8px 6px;

      background: #3D455C;
      border: 0;
      border-radius: 9px;

      color: #FFFFFF;
      font-size: 11px;
      cursor: pointer;
    }

    #test-panel .test-actions button.primary {
      background: #B77C78;
    }

    #test-panel .test-actions button:active {
      opacity: 0.75;
    }

    #test-panel .test-read {
      margin-top: 9px;
      padding-top: 8px;

      border-top: 1px solid rgba(255, 255, 255, 0.12);

      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 8px;

      color: #C6CBDA;
      font-variant-numeric: tabular-nums;
    }

    #test-panel .test-read b {
      color: #8B93A9;
      font-weight: 500;
    }

    #test-panel .test-read span {
      text-align: right;
      color: #FFFFFF;
    }

    #test-panel .test-hint {
      margin-top: 8px;

      font-size: 9px;
      line-height: 1.45;
      color: #8B93A9;
    }
  </style>
</head>

<body>

  <div class="player-label">
    SCOOP EVERYTHING
    <strong>DISRUPT · TEST</strong>
  </div>

  <!--
    TEST COPY of the DISRUPT interaction.

    disrupt-test.js is a byte-for-byte copy of disrupt.js except that
    SHARE_ROOM points at a private test room, so this page can never
    send fragments, shakes or player presence into the live game room
    "scoop-everything-v2c".
  -->
  <script src="disrupt-test.js"></script>

  <!--
    Local test harness.

    In the real game, display.html starts every round by emitting
    "game-countdown" and "game-start" into the room. This page has no
    main screen, so the harness calls the same handlers directly. Nothing
    is emitted to any room.
  -->
  <script>
    (function () {
      "use strict";

      var panel = document.createElement("div");
      panel.id = "test-panel";
      panel.innerHTML =
        '<div class="test-head">' +
          '<span>TEST HARNESS</span>' +
          '<button type="button" id="test-toggle" aria-label="collapse">−</button>' +
        "</div>" +
        '<div class="test-body">' +
          '<div class="test-room" id="test-room">room: …</div>' +
          '<div class="test-actions">' +
            '<button type="button" class="primary" id="test-start">▶ Start round</button>' +
            '<button type="button" id="test-reset">↺ Reset</button>' +
          "</div>" +
          '<div class="test-read">' +
            "<b>phase</b><span id=\"r-phase\">-</span>" +
            "<b>rot X</b><span id=\"r-rx\">-</span>" +
            "<b>rot Y</b><span id=\"r-ry\">-</span>" +
            "<b>movement</b><span id=\"r-move\">-</span>" +
            "<b>fragments</b><span id=\"r-frag\">-</span>" +
            "<b>share</b><span id=" + '"r-net"' + ">-</span>" +
          "</div>" +
          '<div class="test-hint" id="test-hint">' +
            "Tap <b>I&#39;m Ready</b>, then <b>Start round</b>. " +
            "Tilt to move fragments, shake to scatter." +
          "</div>" +
        "</div>";

      document.body.appendChild(panel);

      function el(id) {
        return document.getElementById(id);
      }

      // --- collapse / expand -------------------------------------
      el("test-toggle").addEventListener("click", function () {
        var hidden = panel.classList.toggle("hidden");
        this.textContent = hidden ? "+" : "−";
      });

      // --- call a handler defined by disrupt-test.js -------------
      function fire(name, data) {
        if (typeof window.shareEvent !== "function") {
          el("test-hint").textContent =
            "disrupt-test.js did not load — check the console.";
          return false;
        }
        window.shareEvent(name, data);
        return true;
      }

      // --- start a round without the main screen ------------------
      var startButton = el("test-start");
      var pending = null;

      startButton.addEventListener("click", function () {
        var phase = readPhase();

        if (phase === "countdown" || phase === "playing") {
          el("test-hint").textContent =
            "Round already running — tap Reset first.";
          return;
        }

        var roundId = Date.now();

        if (
          !fire("game-countdown", {
            roundId: roundId,
            countdownMs: 3000
          })
        ) {
          return;
        }

        startButton.disabled = true;
        startButton.textContent = "… 3";
        el("test-hint").textContent = "Countdown running.";

        var left = 3;
        pending = setInterval(function () {
          left -= 1;
          startButton.textContent = left > 0 ? "… " + left : "▶ Start round";
        }, 1000);

        setTimeout(function () {
          clearInterval(pending);
          pending = null;
          startButton.disabled = false;

          // display.html would send this; here we send it ourselves.
          fire("game-start", {
            roundId: roundId,
            remainingMs: 30000
          });

          el("test-hint").textContent =
            "Playing — 30s. Tilt to move fragments.";
        }, 3000);
      });

      // --- back to the lobby --------------------------------------
      el("test-reset").addEventListener("click", function () {
        if (pending) {
          clearInterval(pending);
          pending = null;
          startButton.disabled = false;
          startButton.textContent = "▶ Start round";
        }

        fire("game-reset", {});

        el("test-hint").textContent = "Reset to lobby.";
      });

      // --- live readout -------------------------------------------
      function readPhase() {
        try {
          return typeof gamePhase !== "undefined" ? gamePhase : "-";
        } catch (e) {
          return "-";
        }
      }

      function num(v) {
        return typeof v === "number" && isFinite(v)
          ? v.toFixed(2)
          : "-";
      }

      function set(id, value) {
        var node = el(id);
        if (node) node.textContent = value;
      }

      function refresh() {
        set("r-phase", readPhase());

        try {
          set("r-rx", num(typeof rotationX !== "undefined" ? rotationX : NaN));
          set("r-ry", num(typeof rotationY !== "undefined" ? rotationY : NaN));
        } catch (e) {}

        try {
          set(
            "r-move",
            typeof motionMagnitude !== "undefined"
              ? motionMagnitude.toFixed(2)
              : "-"
          );
        } catch (e) {
          set("r-move", "-");
        }

        try {
          set(
            "r-frag",
            typeof fragments !== "undefined" ? String(fragments.length) : "-"
          );
        } catch (e) {
          set("r-frag", "-");
        }

        try {
          set(
            "r-net",
            typeof shareConnected !== "undefined" && shareConnected
              ? "connected"
              : "offline"
          );
        } catch (e) {
          set("r-net", "-");
        }

        try {
          if (typeof SHARE_ROOM !== "undefined") {
            set("test-room", "room: " + SHARE_ROOM);
          }
        } catch (e) {}

        // In the real game display.html sends "game-over" when the 30s
        // runs out. Alone on the phone nobody sends it, so end the round
        // here instead of leaving it stuck at 0s.
        try {
          if (
            gamePhase === "playing" &&
            roundEndsAt > 0 &&
            Date.now() >= roundEndsAt
          ) {
            fire("game-over", {
              roundId: typeof roundId !== "undefined" ? roundId : null,
              winner: null
            });

            el("test-hint").textContent =
              "Round over — tap Reset to go again.";
          }
        } catch (e) {}
      }

      refresh();
      setInterval(refresh, 200);
    })();
  </script>

</body>
</html>
